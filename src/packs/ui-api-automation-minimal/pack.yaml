name: ui-api-automation-minimal
title: UI + API test automation (minimal)
description: "A compact UI + API pack with four helpers: explore (OpenAPI and/or Playwright MCP), plan, set up a test framework if none exists, and implement tests, each returning the same handoff packet. Pick it for a small first batch of tests or a project without a test framework; for a full suite with review and verification stages, use ui-api-automation."
orchestrator: uiapi-min-orchestrator
